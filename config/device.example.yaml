# Native YAML channel-definition format (alternative to the binding XML files).
# Each channel mirrors a binding <record>. Channels sharing request_byte are
# read/written with a single serial round trip.
name: example_device
channels:
  - channel_id: version
    request_byte: FD
    data_type: Status
    position: 4
    length: 2
    scale: 0.01

  - channel_id: outsideTemperature
    request_byte: FB
    data_type: Sensor
    position: 6
    length: 2
    scale: 0.1
    unit: "°C"

  - channel_id: flowTemperature
    request_byte: FB
    data_type: Sensor
    position: 8
    length: 2
    scale: 0.1
    unit: "°C"

  - channel_id: dhwSetTemperatureDay
    request_byte: "0A0013"
    data_type: Settings
    position: 4
    length: 2
    scale: 0.1
    min: 10
    max: 55
    step: 0.1
    unit: "°C"

  - channel_id: coolingEnabled
    request_byte: "0B0287"
    data_type: Settings
    position: 7
    length: 1
    scale: 1.0
    bit_position: 7
    min: 0
    max: 1
    step: 1.0
